/* Mobile layout fixes: keep product cards and dialogs inside the viewport */
html{width:100%;min-height:100%;overflow-x:hidden}
body{width:100%;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.app{width:100%;min-width:0;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(18px,env(safe-area-inset-bottom))}
.layout,.maincol,.sidecol,.section,.products,.product{min-width:0;max-width:100%}
.products{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.product{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.product h3{max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.35;min-height:2.7em}
.product .meta{overflow-wrap:anywhere;line-height:1.4}
.product-foot{display:flex;flex-wrap:wrap;align-items:stretch;min-width:0;gap:8px}
.product-foot .price{display:block;flex:1 1 100%;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.product-foot .add{display:block;width:100%;max-width:100%;min-width:0;white-space:normal;padding:10px 8px;line-height:1.25;overflow-wrap:anywhere}
.product>div:last-child{margin-top:auto!important;padding-top:8px}
.category{position:sticky;top:0;z-index:4;background:var(--panel);max-width:100%;overscroll-behavior-x:contain}
.modal{overflow-y:auto;overscroll-behavior:contain;align-items:flex-start;padding: max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.dialog{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;margin:auto 0;width:min(440px,100%)}
@media(max-width:480px){
 .app{padding-top:max(10px,env(safe-area-inset-top))}
 .top{flex-wrap:wrap;align-items:center}
 .top-actions{flex-shrink:0}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .product{padding:10px;border-radius:14px}
 .product .emoji{height:54px;flex:0 0 54px}
 .product-photo{height:84px;max-width:100%;object-fit:contain}
 .product-foot .add{font-size:12px}
 .section{padding:12px}
 .tools>*{max-width:100%}
 .profit-panel{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:350px){.products{grid-template-columns:minmax(0,1fr)}.product-foot{flex-wrap:nowrap;align-items:center}.product-foot .price{flex:1 1 auto}.product-foot .add{width:auto;flex:0 0 auto}}



/* ===== FULL APP GLASSMORPHISM THEME ===== */
.product-profit-wrap{margin-top:14px;padding:14px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14)}
.product-profit-wrap h3{font-size:14px;margin:0 0 8px;color:#f7f9ff}
.product-profit-list{display:grid;gap:0}
.product-profit-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.12);font-size:12px}
.product-profit-row:last-child{border-bottom:0}
.product-profit-row small{display:block;color:var(--muted);margin-top:3px}
.product-profit-row strong{color:#c6d8ff;white-space:nowrap}

:root{
 --bg:#101a35;--panel:rgba(255,255,255,.105);--ink:#f4f7ff;--muted:#c0cbe3;

}
.app{isolation:isolate}
.logo,.soft,.stat,.section,.product,.product .emoji,.product-photo,.field,.chip,.cart-row,
.qty button,.dialog,.price-choice,.category,.quickqty select,.photo-preview{
 background:rgba(255,255,255,.095)!important;

}
.section,.stat,.product,.dialog,.price-choice{border-radius:20px}

.chip.active{background:linear-gradient(135deg,#5c8dff,#7865e8)!important;color:#fff!important}
.category{background:rgba(13,25,52,.82)!important}
.category .chip{flex:0 0 auto}
.cart-row{background:rgba(255,255,255,.075)!important}
.qty button{background:rgba(255,255,255,.13)!important}

.brand h1,.section h2,.product h3,.cart-row strong,.sumline,.stat strong{color:#f7f9ff}

.modal{background:rgba(3,9,24,.66)!important;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
.dialog{background:rgba(22,37,70,.88)!important;border:1px solid rgba(255,255,255,.24)!important}

.cost-hidden{filter:blur(7px)}
#receiptPrint{color:#111}
@media(max-width:480px){

}
@media(prefers-reduced-motion:no-preference){.section,.stat,.product,.dialog,.price-choice,.soft,.primary,.add{transition:transform .16s ease,background .2s ease,box-shadow .2s ease}}
